services:
  mongodb:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/careerconnect
      JWT_SECRET: change_this_secret
      CLIENT_URL: http://localhost:5173
    depends_on: [mongodb]
volumes:
  mongo_data:
